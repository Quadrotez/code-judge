<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirect</title>
  <script>
    // Сохраняем оригинальный URL для React Router
    var pathname = window.location.pathname;
    var search = window.location.search;
    sessionStorage.redirect = pathname + search;
    
    // Редирект на index.html (явный редирект через JS)
    window.location.href = '/index.html';
  </script>
</head>
<body>
</body>
</html>
